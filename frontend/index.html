<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Lora:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="header-left">
      <span class="logo">sage</span>
      <span class="tagline">think together</span>
    </div>
    <div class="header-right">
      <button id="history-btn" class="icon-btn" title="Threads">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="8" r="5.5"/>
          <polyline points="8,5 8,8.5 10,10.5"/>
        </svg>
      </button>
      <button id="new-btn" class="new-btn">new</button>
      <button id="settings-btn" class="icon-btn" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Settings panel — slides down from header -->
  <div id="settings-bar" class="settings-panel">
    <div class="sp-row">
      <span class="sp-label">model</span>
      <select id="model-select" title="Select model"></select>
    </div>
    <div class="sp-row">
      <span class="sp-label">web</span>
      <label class="web-toggle" title="Append :online to model">
        <input type="checkbox" id="web-search-toggle" checked />
        <span class="web-pill">
          <span class="web-dot"></span>
          search
        </span>
      </label>
    </div>
    <div class="sp-row">
      <span class="sp-label">api key</span>
      <input type="password" id="api-key-input" placeholder="sk-or-..." autocomplete="off" spellcheck="false" />
      <button id="save-key-btn">save</button>
    </div>
  </div>

  <main id="conversation">
    <div class="empty-state" id="empty-state">
      <div class="empty-inner">
        <div class="empty-symbol">◆</div>
        <p class="empty-prompt" id="empty-prompt">What are you wrestling with today?</p>
        <p class="empty-hint">A question, a half-baked idea, something that doesn't add up.</p>
        <div class="topic-wall" id="topic-wall"></div>
      </div>
    </div>
  </main>

  <footer>
    <div class="compose">
      <div class="mode-bar">
        <button class="mode-btn" data-mode="steelman">steelman</button>
        <button class="mode-btn" data-mode="devil's advocate">devil's advocate</button>
        <button class="mode-btn" data-mode="first principles">first principles</button>
        <button class="mode-btn" data-mode="simplify">simplify</button>
      </div>
      <div class="compose-field">
        <textarea id="input" placeholder="What are you thinking about?" rows="1" autofocus></textarea>
      </div>
      <div class="compose-actions">
        <span class="compose-hint">↵ send &nbsp;·&nbsp; shift+↵ newline</span>
        <button id="send-btn" title="Send">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <line x1="10" y1="17" x2="10" y2="4"/>
            <polyline points="4 9 10 4 16 9"/>
          </svg>
        </button>
      </div>
    </div>
  </footer>

  <!-- History drawer + backdrop (fixed overlays) -->
  <div id="drawer-backdrop" class="drawer-backdrop"></div>
  <nav id="history-drawer" class="history-drawer">
    <div class="drawer-header">
      <span class="drawer-title">threads</span>
      <button id="close-history" class="drawer-close" title="Close">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <line x1="3" y1="3" x2="13" y2="13"/>
          <line x1="13" y1="3" x2="3" y2="13"/>
        </svg>
      </button>
    </div>
    <div class="history-list" id="history-list"></div>
  </nav>

  <script type="module" src="app.js"></script>
</body>
</html>
